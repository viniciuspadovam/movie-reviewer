spring:
  application:
    name: movie-review
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moviereview}
    username: ${DB_USERNAME:moviereview}
    password: ${DB_PASSWORD:moviereview}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

app:
  web:
    frontend-origin: ${FRONTEND_ORIGIN}
  auth:
    username: ${ADMIN_USERNAME}
    password-hash: ${ADMIN_PASSWORD_HASH}
    jwt-secret: ${JWT_SECRET}
    session-ttl: 7d
    cookie-domain: ${COOKIE_DOMAIN:}
    cookie-secure: true
    login-rate-limit:
      attempts: 5
      period: 15m
  tmdb:
    base-url: https://api.themoviedb.org/3
    access-token: ${TMDB_ACCESS_TOKEN:}
    language: pt-BR
    timeout: 5s
