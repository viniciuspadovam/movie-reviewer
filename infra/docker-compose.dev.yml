name: movie-review-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: moviereview
      POSTGRES_USER: moviereview
      POSTGRES_PASSWORD: moviereview
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviereview -d moviereview"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
